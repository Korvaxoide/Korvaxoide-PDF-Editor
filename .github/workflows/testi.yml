name: Verifiche

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testi:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.12 e' il minimo richiesto da NumPy, 3.14 e' la versione con cui il
        # progetto e' stato sviluppato
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Librerie di sistema per Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          # PySide6 porta con se' i suoi moduli ma non le librerie di sistema
          # di cui Qt ha bisogno: senza libegl1 l'import di QtWidgets fallisce
          # con «libEGL.so.1: cannot open shared object file» e la suite non
          # raccoglie nessun test. Le Liberation servono perche' i test della
          # firma e della rimozione dello sfondo scrivono un nome con un font
          # serif, e su una macchina senza font la prova girerebbe su un foglio
          # bianco.
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fonts-liberation

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  integrazione:
    name: Integrazione (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Librerie di sistema per Qt (Linux)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fonts-liberation

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Suite di integrazione
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/integration.py

      - name: Flusso completo
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/finale.py

  licenza:
    name: Coerenza delle licenze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La documentazione resta leggibile anche quando e' rotta: un
      # collegamento a un file cancellato diventa una pagina 404 e non se ne
      # accorge nessuno in revisione. Questa suite non usa Qt, quindi sta
      # qui: si controlla anche quando l'installazione delle dipendenze
      # fallisce, ed e' il posto giusto perche' riguarda il repository e non
      # il programma.
      - name: Documentazione coerente
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install pytest packaging
          python -m pytest tests/test_documentazione.py -q

      - name: Il testo della licenza è quello ufficiale
        run: |
          set -e
          curl -sSfL https://www.gnu.org/licenses/agpl-3.0.txt -o /tmp/agpl.txt
          if ! diff -q LICENSE /tmp/agpl.txt; then
            echo "::error::LICENSE non coincide con il testo AGPL-3.0 ufficiale"
            exit 1
          fi

      - name: Ogni dipendenza è dichiarata
        run: |
          python - <<'EOF'
          from pathlib import Path
          req = [l.split("==")[0].strip().lower()
                 for l in Path("requirements.txt").read_text().splitlines()
                 if l.strip() and not l.startswith("#")]
          testo = Path("THIRD-PARTY.md").read_text(encoding="utf-8").lower()
          mancanti = [p for p in req if p not in testo]
          if mancanti:
              raise SystemExit(f"dipendenze non documentate: {mancanti}")
          print(f"{len(req)} dipendenze, tutte documentate")
          EOF

      - name: Nessuna dipendenza inutilizzata
        run: |
          python - <<'EOF'
          # reportlab e pikepdf erano dichiarati, documentati e controllati
          # qui, ma nel programma non venivano importati: gli utenti li
          # installavano e nessuno li usava. Questo controllo lo impedisce.
          import ast
          import re
          from pathlib import Path

          alias = {"pillow": "pil", "pymupdf": "pymupdf", "pyside6": "pyside6"}
          usati = set()
          for sorgente in Path("pdfeditor").rglob("*.py"):
              for nodo in ast.walk(ast.parse(sorgente.read_text(encoding="utf-8"))):
                  if isinstance(nodo, ast.Import):
                      usati.update(a.name.split(".")[0].lower() for a in nodo.names)
                  elif isinstance(nodo, ast.ImportFrom) and nodo.level == 0 and nodo.module:
                      usati.add(nodo.module.split(".")[0].lower())
          richieste = [l.split("==")[0].strip().lower()
                       for l in Path("requirements.txt").read_text().splitlines()
                       if l.strip() and not l.startswith("#")]
          inutilizzate = [p for p in richieste
                          if alias.get(p, p) not in usati]
          if inutilizzate:
              raise SystemExit(
                  "dipendenze dichiarate ma mai importate: "
                  f"{inutilizzate} (togliile o usale)"
              )
          print(f"{len(richieste)} dipendenze, tutte usate")
          EOF
